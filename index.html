<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Turveier i Oslo</title>
<meta name="description" content="An interactive map of Oslo's marked walking trails (turveier), with distance and duration for each route." />
<meta property="og:title" content="Turveier i Oslo" />
<meta property="og:description" content="An interactive map of Oslo's marked walking trails (turveier), with distance and duration for each route." />
<meta property="og:type" content="website" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <p class="eyebrow">Track log 001</p>
      <h1>Turveier i Oslo</h1>
    </div>

    <div class="section">
      <div class="section-header">
        <button class="collapse-toggle" id="routes-toggle" aria-expanded="true" aria-controls="route-list">
          <span class="chevron">▾</span>
          <h2>Saved routes</h2>
        </button>
        <button id="deselect-all-btn" class="text-btn">Deselect all</button>
      </div>
      <ul class="route-list" id="route-list">
        <li class="empty-note">Loading routes…</li>
      </ul>
    </div>

  </aside>

  <div class="map-wrap">
    <button id="locate-btn" class="map-fab" title="Find my location" aria-label="Find my location">⌖</button>
    <div id="map"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
